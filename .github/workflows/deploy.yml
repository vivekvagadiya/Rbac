name: MERN CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # REQUIRED for Environment Secrets
    environment: Preview
    
    # Permissions for auto-fix commits
    permissions:
      contents: write

    # Inject GitHub Secrets into process.env
    env:
      PORT: ${{ secrets.PORT || 5000 }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      # Email service variables
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST || 'smtp.gmail.com' }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT || 587 }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'http://localhost:5173' }}
      # Cloudinary variables
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # =========================
      # FRONTEND
      # =========================

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Auto-fix Lint Issues
        run: |
          cd frontend
          npm run lint -- --fix || true
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || git commit -m "Auto-fix lint issues [skip ci]"

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # =========================
      # BACKEND
      # =========================

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      # Backend Test
      - name: Test Backend
        run: |
          cd backend
          npm test
        continue-on-error: true  # Continue even if tests fail (for now)

      # =========================
      # DEPLOYMENT
      # =========================

      # Deploy Frontend to Vercel/Netlify
      - name: Deploy Frontend
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Frontend build successful - ready for deployment"
          # Add deployment steps here (Vercel, Netlify, etc.)

      # Deploy Backend to Render/Railway
      - name: Deploy Backend
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Backend tests passed - ready for deployment"
          # Add deployment steps here (Render, Railway, etc.)

  # Separate job for integration tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    environment: Preview

    env:
      PORT: ${{ secrets.PORT || 5000 }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Start Backend Server
        run: |
          cd backend
          npm start &
          sleep 10  # Wait for server to start

      - name: Run Integration Tests
        run: |
          echo "Running integration tests..."
          # Add integration tests here