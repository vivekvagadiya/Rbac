name: MERN CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # REQUIRED for Environment Secrets
    environment: Preview

    # Inject GitHub Secrets into process.env
    env:
      PORT: ${{ secrets.PORT }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # FRONTEND
      # =========================

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # =========================
      # BACKEND
      # =========================

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      # Backend Test
      - name: Test Backend
        run: |
          cd backend
          npm test
      
      # Deploy Backend to Render (or similar)
      - name: Deploy Backend
        run: |
          echo "Backend tests passed - ready for deployment"
          # Add deployment steps here (Render, Railway, etc.)